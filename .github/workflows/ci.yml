name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: dbt deps and parse
        working-directory: dbt_weather
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/ci
        run: |
          dbt deps
          dbt parse